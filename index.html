<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html" aria-label="Startseite neu laden">
        <img src="src/img/logo.png" alt="Logo">
      </a>
      <details class="menu">
        <summary aria-label="Menü öffnen"><span></span><span></span></summary>
        <nav aria-label="Hauptnavigation">
          <a href="#ueber-mich">Über mich</a>
          <a href="#projekte">Projekte</a>
          <a href="#alle-projekte">Alle Projekte</a>
          <a href="#kontakt">Kontakt</a>
        </nav>
      </details>
    </header>
    <section class="page page-home" id="start">
      <h1 class="page-title">DarkPlugins</h1>
      <main class="gallery" aria-label="Bildergalerie">
        <img class="picture" src="src/img/pfi/01.png" alt="">
        <img class="picture" src="src/img/pfi/02.png" alt="">
        <img class="picture" src="src/img/pfi/03.png" alt="">
        <img class="picture" src="src/img/pfi/04.png" alt="">
        <img class="picture" src="src/img/pfi/05.png" alt="">
        <img class="picture" src="src/img/pfi/06.png" alt="">
        <img class="picture" src="src/img/pfi/07.png" alt="">
      </main>
      <p class="page-subtitle">Software Engineer</p>
    </section>
    <section class="page page-projects" id="projekte" aria-label="Projekte">
      <div class="projects-content">
        <p class="section-label">Ausgewählte Arbeiten</p>
        <h2>Neuste Projekte</h2>
        <div class="project-grid">
          <a class="project-card" href="#projekt-eins">
            <img src="src/img/projects/featured_1.png" alt="Vorschau des ersten Projekts">
            <div class="project-card__content">
              <h3>Creative Systems</h3>
              <span class="project-card__cta">Jetzt anschauen</span>
            </div>
          </a>
          <a class="project-card" href="#projekt-zwei">
            <img src="src/img/projects/featured_2.png" alt="Vorschau des zweiten Projekts">
            <div class="project-card__content">
              <h3>Digital Playground</h3>
              <span class="project-card__cta">Jetzt anschauen</span>
            </div>
          </a>
        </div>
      </div>
    </section>
    <section class="page page-all-projects" id="alle-projekte" aria-label="Alle Projekte">
      <div class="all-projects-content">
        <p class="section-label">Entdecke mehr</p>
        <h2>Alle Projekte</h2>
        <div class="category-grid">
          <a class="category-card category-github" href="https://github.com/" target="_blank" rel="noreferrer">
            <img src="src/img/projects/bg_github.png" alt="GitHub Projekte">
            <span>GitHub</span>
            <small>Code &amp; Open Source</small>
          </a>
          <a class="category-card category-spigot" href="https://www.spigotmc.org/" target="_blank" rel="noreferrer">
            <img src="src/img/projects/bg_spigotmc.png" alt="SpigotMC Projekte">
            <span>SpigotMC</span>
            <small>Minecraft Plugins</small>
          </a>
          <a class="category-card category-labs" href="#labs">
            <img src="src/img/projects/bg_labs.png" alt="Labs Projekte">
            <span>Labs</span>
            <small>Experimente &amp; Ideen</small>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
